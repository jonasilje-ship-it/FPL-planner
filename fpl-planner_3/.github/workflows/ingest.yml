name: FPL ingest

on:
  schedule:
    # Tider i UTC. Norsk tid er +2 (sommer) / +1 (vinter).
    - cron: "15 */2 * * *"   # annenhver time: priser og eierskap
    - cron: "30 3 * * *"     # 05:30 norsk tid: full oppdatering etter prisendringene
  workflow_dispatch:
    inputs:
      job:
        description: "Hvilken jobb som skal kjores"
        required: true
        default: daily
        type: choice
        options: [core, prices, history, squad, historical, hourly, daily]

concurrency:
  group: fpl-ingest
  cancel-in-progress: false

jobs:
  ingest:
    # Denne jobben er for Postgres-veien (Supabase + Streamlit). Bruker du
    # GitHub Pages i stedet, er den ikke nodvendig - og da hopper den over
    # seg selv i stedet for a feile paa en manglende DATABASE_URL.
    if: vars.USE_POSTGRES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FPL_ENTRY_ID: ${{ secrets.FPL_ENTRY_ID }}
      FPL_THROTTLE_SECONDS: "0.4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Velg jobb
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 3 * * *" ]; then
            echo "job=daily" >> "$GITHUB_OUTPUT"
          else
            echo "job=hourly" >> "$GITHUB_OUTPUT"
          fi

      - name: Kjor ingest
        run: python scripts/run_ingest.py ${{ steps.pick.outputs.job }} --verbose
