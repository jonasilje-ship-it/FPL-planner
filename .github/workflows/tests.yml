name: Tester

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Kontrakttestene mot FPL-APIet kjores ikke i CI - de ville gjort
      # bygget rodt hver gang FPL har en darlig dag.
      - run: pytest -q -m "not network"
